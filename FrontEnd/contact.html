<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiseFaze — Contact Us</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-mode">

<!-- Header -->
<header class="header">
  <a href="index.html" class="logo">
    <img src="media/logo.png" alt="RiseFaze logo" class="logo-img">
    RiseFaze
  </a>
  <nav>
    <a href="index.html#features" class="nav-link">Features</a>
    <a href="explore.html" class="nav-link">Explore</a>
    <a href="index.html#about" class="nav-link">Learn More</a>
    <a href="help.html" class="nav-link">Help</a>
    <button class="btn mode-toggle" id="modeToggle">🌙</button>
    <button class="btn login-btn" id="loginBtn">Login</button>
    <button class="btn primary-btn" id="signupBtn">Sign Up</button>
  </nav>
</header>

<!-- Main Content -->
<main class="static-page-container lazy-load">
  <div class="feature-card auth-form-card" style="max-width: 500px;">
    <h2>Get in Touch</h2>
    <p>Have a question, feedback, or a business inquiry? Send a message below.</p>
    <form id="contactForm">
      <div class="auth-form-group">
        <label for="name">Your Name</label>
        <input id="name" name="name" type="text" required placeholder="Your Name" />
      </div>
      <div class="auth-form-group">
        <label for="email">Your Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="auth-form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Your message..." rows="5"></textarea>
      </div>
      <button type="submit" class="btn primary-btn auth-submit-btn">Send Message</button>
    </form>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2025 RiseFaze. All rights reserved. <strong>Version 1.0</strong></p>
    <div class="footer-links">
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>
