<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="media/favicon.png"/>
  <title>RiseFaze — Explore</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-mode">

<!-- Header -->
<header class="header">
  <a href="index.html" class="logo">
    <img src="media/logo.png" alt="RiseFaze logo" class="logo-img">
    RiseFaze
  </a>
  <nav>
    <input type="search" placeholder="Search assets, users..." class="search-input">
    <button class="btn mode-toggle" id="modeToggle">🌙</button>
    <button class="btn login-btn" id="loginBtn">Login</button>
    <button class="btn primary-btn" id="signupBtn">Sign Up</button>     
  </nav>
</header>

<!-- Main Content: Assets Grid -->
<main class="assets-container lazy-load">
  <!-- Leaderboard Section -->
  <div class="leaderboard-container">
    <h2>Global Leaderboard</h2>
    <div class="leaderboard-header">
      <span class="rank-header">Rank</span>
      <span class="user-header">Username</span>
      <span class="net-worth-header">Net Worth</span>
    </div>
    <ol class="leaderboard-list">
      <!-- Leaderboard items will be dynamically inserted here by main.js -->
      <p class="loading-message" id="leaderboard-loading">Loading leaderboard...</p>
    </ol>
  </div>
  <!-- Marketplace Section -->
  <div class="marketplace-container">
    <h2>RiseFaze Bank Assets</h2>
    <div class="assets-grid">
      <!-- Asset cards will be dynamically inserted here by main.js -->
      <p class="loading-message" id="assets-loading">Loading assets from the bank...</p>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2025 RiseFaze. All rights reserved. <strong>Version 1.0</strong></p>
    <div class="footer-links">
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<!-- Floating Feedback Button -->
<button class="feedback-btn" id="feedbackBtn" title="Send Feedback">Feedback</button>

<script src="main.js"></script>
</body>
</html>
